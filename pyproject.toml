[project]
name = "second-brain"
version = "0.1.0"
description = "Personal second brain with bi-temporal memory graph"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Ingestion
    "pymupdf>=1.24.0",        # PDF extraction (fitz)
    "python-frontmatter>=1.0", # YAML frontmatter parsing

    # Enrichment
    "sentence-transformers>=3.0",
    "torch>=2.0",

    # Storage
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",

    # Graph (Phase 2 stub)
    "networkx>=3.3",

    # LLM
    "anthropic>=0.34.0",

    # Scheduler (Phase 5)
    "apscheduler>=3.10",

    # Frontend
    "nicegui>=1.4.0",

    # Utilities
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",  # For FastAPI test client",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
